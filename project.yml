name: GuageTV
options:
  bundleIdPrefix: com.guage
  deploymentTarget:
    iOS: "16.0"
packages:
  # FFmpegKit (kingslay fork): its libmpv product ships a real iOS-device
  # slice (checked: ios-arm64 present) — FFmpeg demux/decode + libass +
  # dav1d + libdovi, the stack Rex uses. KSPlayer was tried first, but its
  # free/GPL xcframework has NO ios-arm64 device slice (simulator/mac/tvOS
  # only) and cannot link into a device build.
  FFmpegKit:
    url: https://github.com/kingslay/FFmpegKit.git
    from: 9.0.2
targets:
  GuageTV:
    type: application
    platform: iOS
    dependencies:
      - package: FFmpegKit
        product: libmpv
    postBuildScripts:
      - name: Install Python stdlib
        script: bash "$PROJECT_DIR/scripts/install_python_nosign.sh"
        basedOnDependencyAnalysis: false
    sources:
      - GuageTV/Sources
      - GuageTV/Assets.xcassets
      - path: GuageTV/Python
        type: folder
      - path: GuageTV/JSBundle
        type: folder
    info:
      path: GuageTV/Info.plist
      properties:
        CFBundleDisplayName: 呱壳
        CFBundleShortVersionString: "1.10"
        CFBundleVersion: "110"
        NSPhotoLibraryAddUsageDescription: 保存播放截图到相册
        UILaunchScreen: {}
        # TVBox configs, CMS APIs and media streams are very often plain
        # HTTP; without this, App Transport Security blocks every load
        # (the "requires the use of a secure connection" import error).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      TARGETED_DEVICE_FAMILY: "1,2"
      # Python (BeeWare python-apple-support, fetched by CI to the
      # project root): linked by flag, embedded by the post-build
      # script. XcodeGen's framework-dependency route did not resolve
      # the module in CI (run #29), so this stays fully manual.
      FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Python.xcframework/ios-arm64"
      OTHER_LDFLAGS: "$(inherited) -framework Python"
      SWIFT_OBJC_BRIDGING_HEADER: GuageTV/Sources/GuageTV-Bridging-Header.h
      HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Python.xcframework/ios-arm64/Python.framework/Headers"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Stage 1: add Python.xcframework (python-apple-support) as an embedded
    # framework here, plus the libpython / ssl / crypto dylibs it ships.
