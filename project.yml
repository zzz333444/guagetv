name: GuageTV
options:
  bundleIdPrefix: com.guage
  deploymentTarget:
    iOS: "16.0"
packages:
  # KSPlayer: dual-engine player (AVPlayer + mpv/FFmpeg via its MPVPlayer
  # module — libass ASS subtitles, dav1d AV1, MKV/FLV demuxing). GPL-3.0;
  # this project is personal-use and its source stays public in this repo.
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    branch: main
targets:
  GuageTV:
    type: application
    platform: iOS
    dependencies:
      - package: KSPlayer
        product: KSPlayerUI
      - package: KSPlayer
        product: MPVPlayer
    sources:
      - GuageTV/Sources
      - path: GuageTV/Python
        type: folder
    info:
      path: GuageTV/Info.plist
      properties:
        CFBundleDisplayName: 呱壳
        UILaunchScreen: {}
        # TVBox configs, CMS APIs and media streams are very often plain
        # HTTP; without this, App Transport Security blocks every load
        # (the "requires the use of a secure connection" import error).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      TARGETED_DEVICE_FAMILY: "1,2"
    # Stage 1: add Python.xcframework (python-apple-support) as an embedded
    # framework here, plus the libpython / ssl / crypto dylibs it ships.
