name: GuageTV
options:
  bundleIdPrefix: com.guage
  deploymentTarget:
    iOS: "16.0"
packages:
  # FFmpegKit (kingslay fork): its libmpv product ships a real iOS-device
  # slice (checked: ios-arm64 present) — FFmpeg demux/decode + libass +
  # dav1d + libdovi, the stack Rex uses. KSPlayer was tried first, but its
  # free/GPL xcframework has NO ios-arm64 device slice (simulator/mac/tvOS
  # only) and cannot link into a device build.
  FFmpegKit:
    url: https://github.com/kingslay/FFmpegKit.git
    from: 9.0.2
targets:
  GuageTV:
    type: application
    platform: iOS
    dependencies:
      - package: FFmpegKit
        product: libmpv
    sources:
      - GuageTV/Sources
      - path: GuageTV/Python
        type: folder
    info:
      path: GuageTV/Info.plist
      properties:
        CFBundleDisplayName: 呱壳
        UILaunchScreen: {}
        # TVBox configs, CMS APIs and media streams are very often plain
        # HTTP; without this, App Transport Security blocks every load
        # (the "requires the use of a secure connection" import error).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      TARGETED_DEVICE_FAMILY: "1,2"
    # Stage 1: add Python.xcframework (python-apple-support) as an embedded
    # framework here, plus the libpython / ssl / crypto dylibs it ships.
